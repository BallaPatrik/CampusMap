<h1 class="page-title">Buildings</h1>

<div class="button-container">
  <button mat-fab extended class="add-button" (click)="onCreate()">
    <mat-icon>add</mat-icon>
    Add new building
  </button>

  @if (this.selectedBuildingCount() > 0) {
    <button matFab extended>
      <mat-icon>remove</mat-icon>
      Remove selected building(s)
    </button>
  }
  @if (this.selectedBuildingCount() == 1) {
    <button matFab extended>
      <mat-icon>edit</mat-icon>
      Edit selected building
    </button>
  }
</div>
<div>
  <p>Selected: {{ this.selectedBuildingCount() }} building(s)</p>
</div>

<input
  type="text"
  placeholder="Search buildings..."
  [value]="searchString()"
  (input)="searchString.set($any($event.target).value)"
>
<!--$event.target is the input element-->
<!--($event.target).value is the value of the input element-->
<!--$any is used to cast the value to any type-->

<div class="building-grid">
  @for (building of allBuildings() | buildingSearch: searchString(); track building.id) {
    <app-building-card
      [building]="building" (selectAction)="onSelect($event)"
    />
  }
</div>
